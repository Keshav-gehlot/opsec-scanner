[project]
name = "opsec-scanner"
version = "0.9.0"
description = "Self-audit OPSEC leak scanner for git history, media metadata, and identity correlation."
requires-python = ">=3.10"
dependencies = [
    "GitPython>=3.1.43",
    "PyMuPDF>=1.24.0",
    "python-docx>=1.1.0",
    "PyYAML>=6.0.1",
    "rich>=13.7.0",
    "pytesseract>=0.3.10",
    "Pillow>=10.0.0",
    "weasyprint>=62.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pypdf>=4.0.0"]
platform = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "sqlalchemy>=2.0.0",
    "authlib>=1.3.0",
    "pyjwt>=2.7.0",
    "bcrypt>=4.1.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "itsdangerous>=2.1.0",
    "email-validator>=2.0.0",
]

[project.scripts]
opsec-scan = "opsec_scanner.main:cli"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["opsec_scanner*"]
