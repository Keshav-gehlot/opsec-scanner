# Render Blueprint for the platform API (https://render.com/docs/blueprint-spec).
#
# Configuration of the "opsec-scanner-api" service. When the service is
# managed as a Blueprint, Render applies this file on every push to main;
# otherwise compare it against the dashboard settings by hand.
# Secret values are never stored here (sync: false = set in the dashboard).
services:
  - type: web
    name: opsec-scanner-api
    # Docker, not the native Python runtime: the image adds exiftool and
    # tesseract so uploaded media get EXIF and OCR analysis (audit P4).
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    branch: main
    # Render restarts an instance whose database check fails (audit P2).
    healthCheckPath: /health/ready
    autoDeploy: true
    envVars:
      - key: PLATFORM_COOKIE_SECURE
        value: "true"
      - key: PLATFORM_BASE_URL
        value: https://opsec-scanner-seven.vercel.app
      - key: PLATFORM_ALLOWED_ORIGINS
        value: https://opsec-scanner-seven.vercel.app
      - key: PLATFORM_JWT_SECRET
        sync: false
      # Same value as the Vercel env var of the same name (middleware.js).
      - key: PLATFORM_PROXY_SECRET
        sync: false
      # Same value as the repository secret of the same name (keep-alive workflow).
      - key: PLATFORM_SCHEDULER_TOKEN
        sync: false
      # Set to "true" only after /health shows proxy_verified: true.
      - key: PLATFORM_REQUIRE_PROXY_SECRET
        value: "false"
      # Password reset emails + email alerts (optional).
      - key: PLATFORM_SMTP_HOST
        sync: false
      - key: PLATFORM_SMTP_USER
        sync: false
      - key: PLATFORM_SMTP_PASSWORD
        sync: false
      - key: PLATFORM_SMTP_FROM
        sync: false
      - key: PLATFORM_OAUTH_SESSION_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Web workspace scanning (see opsec_platform/README.md for all limits).
      - key: PLATFORM_WEB_SCANS_ENABLED
        value: "true"
      - key: PLATFORM_SCAN_MAX_CONCURRENT
        value: "1"
      - key: PLATFORM_LOG_FORMAT
        value: json
      - key: PLATFORM_GITHUB_TOKEN
        sync: false
      - key: PLATFORM_HIBP_API_KEY
        sync: false
      - key: PLATFORM_SHODAN_API_KEY
        sync: false
