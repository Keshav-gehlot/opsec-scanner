# Alembic CLI config for the platform database (see opsec_platform/README.md,
# "Database migrations"). The app also applies migrations itself at startup.
# The database URL comes from PLATFORM_DATABASE_URL / DATABASE_URL, exactly as
# the app resolves it; never put a connection string in this file.
[alembic]
script_location = opsec_platform:migrations
prepend_sys_path = .

[loggers]
keys = root,alembic
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARNING
handlers = console
[logger_alembic]
level = INFO
handlers =
qualname = alembic
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
