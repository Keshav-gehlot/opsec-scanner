name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04
    # Fail in minutes, not hours, if an external service hangs.
    timeout-minutes: 20
    strategy:
      # One version failing should not cancel the others; each result is useful.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Root cause of the 2026-11-11 CI outage: both tools came from the
      # runner's Ubuntu package mirror (azure.archive.ubuntu.com). When its
      # DNS stopped resolving, apt retried for ~13 minutes and every Python
      # job failed before a single test ran. Neither tool may depend on that
      # mirror being up any more.

      # exiftool is pure Perl (preinstalled on runners) and released upstream
      # on GitHub. Pinned to the tag's commit, so a moved tag fails loudly.
      - name: Install exiftool (pinned upstream release)
        env:
          EXIFTOOL_TAG: "13.63"
          EXIFTOOL_COMMIT: "1da714924f67763b6a8a7013dd2aa1983a16f87b"
        run: |
          git clone --quiet --depth 1 --branch "$EXIFTOOL_TAG" \
            https://github.com/exiftool/exiftool.git "$RUNNER_TEMP/exiftool"
          actual="$(git -C "$RUNNER_TEMP/exiftool" rev-parse HEAD)"
          if [ "$actual" != "$EXIFTOOL_COMMIT" ]; then
            echo "::error title=exiftool pin mismatch::tag $EXIFTOOL_TAG is $actual, expected $EXIFTOOL_COMMIT"
            exit 1
          fi
          echo "$RUNNER_TEMP/exiftool" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/exiftool/exiftool" -ver

      # tesseract only ships as a distro package. Short retries and a hard
      # time limit; if the mirror is down the suite still runs (it passes
      # without the binary) and the next step flags the lost OCR coverage.
      - name: Install tesseract (best effort)
        timeout-minutes: 4
        continue-on-error: true
        run: |
          apt_opts="-o Acquire::Retries=2 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15"
          sudo apt-get $apt_opts update
          sudo apt-get $apt_opts install -y --no-install-recommends tesseract-ocr

      - name: Report media tool coverage
        run: |
          exiftool -ver
          if command -v tesseract >/dev/null 2>&1; then
            tesseract --version 2>&1 | head -n 1
          else
            echo "::warning title=OCR not exercised::tesseract could not be installed (Ubuntu package mirror unreachable). Tests ran on the no-OCR path."
          fi

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,platform]"

      - name: Run test suite
        run: pytest tests/ -v

      - name: Verify the installed console command actually works
        # Regression guard for the exact packaging bug found earlier in
        # this project's history: `pip install -e .` succeeding is not
        # the same as the `opsec-scan` console command actually running.
        # Run it from outside the repo directory, not just `python -m`.
        run: |
          cd /tmp
          opsec-scan --help

  webui-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install and test webui
        working-directory: webui
        run: |
          npm install
          npm test

  platform-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Production runs on Postgres; migrations are also exercised against it.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: opsec
          POSTGRES_PASSWORD: opsec-ci-only
          POSTGRES_DB: opsec
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U opsec" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install platform dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[platform,dev]"

      - name: Run platform test suite
        env:
          PLATFORM_JWT_SECRET: "ci-test-secret-not-for-production"
          PLATFORM_COOKIE_SECURE: "false"
          OPSEC_TEST_POSTGRES_URL: "postgresql+psycopg://opsec:opsec-ci-only@localhost:5432/opsec"
        run: pytest tests_platform/ -v

      - name: Models and migrations are in sync
        env:
          PLATFORM_COOKIE_SECURE: "false"
          PLATFORM_DATABASE_URL: "sqlite:////tmp/alembic-check.db"
        run: |
          alembic upgrade head
          alembic check

      - name: Audit dependencies for known vulnerabilities
        run: |
          pip install pip-audit
          pip-audit --skip-editable


  platform-frontend-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check platform browser bundle
        run: |
          node --check opsec_platform/static/login.js
          node --check opsec_platform/static/workspace.js
          python - <<'PY'
          from pathlib import Path
          # The CSP (style-src/script-src 'self') blocks inline styles and
          # scripts, so neither page nor script may rely on them.
          for name in ("login.html", "app.html"):
              html = Path("opsec_platform/static", name).read_text()
              assert 'style="' not in html, f"{name} must not contain inline style attributes"
              assert "<script>" not in html, f"{name} must not contain inline scripts"
          for name in ("login.js", "workspace.js"):
              js = Path("opsec_platform/static", name).read_text()
              assert 'style="' not in js, f"{name} must not generate inline style attributes"
          PY
