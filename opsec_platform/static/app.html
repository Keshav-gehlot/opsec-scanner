<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="OPSEC Scanner workspace">
<meta name="theme-color" content="#070a0d">
<title>OPSEC Scanner workspace</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/app.css">
<link rel="stylesheet" href="/static/workspace.css">
</head>
<body>
<div id="appShell" class="ws">
  <aside class="ws-side" aria-label="Workspace navigation">
    <a class="brand" href="/dashboard#/overview" aria-label="OPSEC Scanner overview">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M12 3 20 6v5c0 5.2-3.4 8.6-8 10-4.6-1.4-8-4.8-8-10V6l8-3Z" stroke="currentColor" stroke-width="1.7"/><path d="m8.5 12 2.2 2.2 4.9-5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <span class="brand-copy"><strong>OPSEC Scanner</strong><span>Workspace</span></span>
    </a>
    <button id="navToggle" class="ws-nav-toggle secondary compact" type="button" aria-expanded="false" aria-controls="wsNav">Menu</button>
    <nav id="wsNav" class="ws-nav">
      <div class="ws-nav-group">Scanner</div>
      <a href="#/overview" data-nav="overview">Operations Center</a>
      <a href="#/new" data-nav="new">New scan</a>
      <a href="#/scans" data-nav="scans">Scan history</a>
      <a href="#/profile" data-nav="profile">Identity profile</a>
      <div class="ws-nav-group">Account</div>
      <a href="#/tokens" data-nav="tokens">CLI access tokens</a>
      <a href="#/account" data-nav="account">Account &amp; sessions</a>
      <a href="#/org" data-nav="org" id="orgNav" hidden>Organization</a>
    </nav>
    <div class="ws-user">
      <div class="ws-user-meta"><strong id="userEmail">…</strong><span id="userRole"></span></div>
      <button id="logoutButton" class="secondary compact" type="button">Sign out</button>
    </div>
  </aside>
  <main class="ws-main" id="main" tabindex="-1">
    <div id="notice" class="notice" role="status" aria-live="polite"></div>
    <div id="view" aria-live="polite"><div class="skeleton"></div><div class="skeleton"></div></div>
  </main>
</div>
<script src="/static/workspace.js" defer></script>
</body>
</html>
